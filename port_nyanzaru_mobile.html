<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Порт Ньянзару — мобильная карта</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #1a0f0a;
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(184,134,11,0.03) 40px, rgba(184,134,11,0.03) 41px),
      repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(139,26,26,0.03) 40px, rgba(139,26,26,0.03) 41px);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(180deg, #1a0f0a 0%, #2c1810 50%, #1a0f0a 100%);
    border-bottom: 2px solid #b8860b;
    padding: 14px 32px;
    text-align: center;
    position: relative;
    flex-shrink: 0;
  }
  header::before { content: '✦'; color: #b8860b; position: absolute; top: 50%; left: 16px; transform: translateY(-50%); font-size: 20px; }
  header::after  { content: '✦'; color: #b8860b; position: absolute; top: 50%; right: 16px; transform: translateY(-50%); font-size: 20px; }
  header h1 { font-family: 'Cinzel', serif; color: #b8860b; font-size: 26px; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 20px rgba(184,134,11,0.5); margin-bottom: 3px; }
  header p  { color: #a08060; font-size: 11px; letter-spacing: 2px; font-family: 'Cinzel', serif; }

  .main-layout {
    display: flex;
    flex: 1;
    padding: 16px;
    gap: 12px;
    align-items: flex-start;
    min-height: 0;
  }

  /* LEFT PANEL */
  .legend-panel {
    width: 190px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #2c1810, #1a0f0a);
    border: 1px solid #b8860b;
    border-radius: 4px;
    padding: 14px 11px;
    position: sticky;
    top: 16px;
  }
  .legend-title { font-family: 'Cinzel', serif; color: #b8860b; font-size: 10px; letter-spacing: 2px; text-align: center; margin-bottom: 12px; padding-bottom: 7px; border-bottom: 1px solid rgba(184,134,11,0.3); }
  .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; cursor: pointer; padding: 4px 5px; border-radius: 3px; transition: background 0.2s; }
  .legend-item:hover { background: rgba(184,134,11,0.1); }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  .legend-label { color: #c9a96e; font-size: 12px; line-height: 1.3; }

  .search-section { margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(184,134,11,0.2); }
  .search-box {
    width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(184,134,11,0.3);
    border-radius: 3px; color: #c9a96e; font-family: 'Crimson Text', serif;
    font-size: 13px; padding: 6px 9px; outline: none; transition: border-color 0.2s;
  }
  .search-box:focus { border-color: #b8860b; }
  .search-box::placeholder { color: #6b4c30; font-style: italic; }
  .search-results { margin-top: 6px; }
  .search-result-item {
    cursor: pointer; padding: 5px 7px; margin-bottom: 3px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(184,134,11,0.15);
    border-radius: 3px; transition: background 0.2s;
  }
  .search-result-item:hover { background: rgba(184,134,11,0.15); }
  .sri-name { font-family: 'Cinzel', serif; font-size: 10px; color: #f0d090; }
  .sri-dist { font-size: 11px; color: #6b4c30; }

  /* MAP CONTAINER */
  .map-container { flex: 1; min-width: 0; }
  .map-wrapper { position: relative; display: inline-block; max-width: 100%; user-select: none; }
  .map-wrapper img { display: block; max-width: 100%; height: auto; border: 2px solid #b8860b; box-shadow: 0 0 30px rgba(0,0,0,0.8); border-radius: 2px; }

  /* MARKERS */
  .marker { position: absolute; transform: translate(-50%, -50%); cursor: pointer; transition: transform 0.2s; z-index: 10; }
  .marker:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 20; }
  .marker.active { transform: translate(-50%, -50%) scale(1.15); z-index: 25; }
  .marker.active .mc { box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255,255,255,0.5); }
  .marker.dimmed { opacity: 0.2; pointer-events: none; }
  .mc {
    width: 21px; height: 21px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 2px 5px rgba(0,0,0,0.7);
    transition: box-shadow 0.2s;
  }
  .mn { color: #fff; font-size: 9px; font-weight: 700; font-family: 'Cinzel', serif; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }

  /* Tooltip */
  .tip {
    position: absolute; bottom: calc(100% + 5px); left: 50%;
    transform: translateX(-50%);
    background: rgba(10,5,2,0.92); border: 1px solid #b8860b;
    color: #f0d090; font-family: 'Cinzel', serif; font-size: 9.5px;
    padding: 3px 7px; border-radius: 3px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 50;
  }
  .marker:hover .tip { opacity: 1; }

  /* RIGHT PANEL */
  .info-panel {
    width: 300px; flex-shrink: 0;
    position: sticky; top: 16px;
    max-height: calc(100vh - 110px); overflow-y: auto;
  }
  .info-panel::-webkit-scrollbar { width: 3px; }
  .info-panel::-webkit-scrollbar-track { background: #1a0f0a; }
  .info-panel::-webkit-scrollbar-thumb { background: #b8860b; border-radius: 2px; }

  .ph {
    background: linear-gradient(180deg, #2c1810, #1a0f0a);
    border: 1px solid rgba(184,134,11,0.25); border-radius: 4px;
    padding: 40px 20px; text-align: center; color: #6b4c30;
  }
  .ph-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.4; }
  .ph p { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1px; line-height: 1.8; }

  .loc-card { background: linear-gradient(180deg, #2c1810 0%, #1f1208 100%); border: 1px solid #b8860b; border-radius: 4px; overflow: hidden; display: none; }
  .loc-card.vis { display: block; animation: si 0.2s ease; }
  @keyframes si { from { opacity:0; transform:translateX(8px); } to { opacity:1; transform:translateX(0); } }

  .card-hdr { padding: 14px 16px 11px; border-bottom: 1px solid rgba(184,134,11,0.25); position: relative; }
  .card-num { font-family: 'Cinzel', serif; font-size: 10px; color: #b8860b; letter-spacing: 2px; margin-bottom: 3px; opacity: 0.8; }
  .card-title { font-family: 'Cinzel', serif; color: #f0d090; font-size: 16px; font-weight: 600; line-height: 1.2; margin-bottom: 6px; padding-right: 24px; }
  .card-dist { display: inline-block; font-size: 10px; font-family: 'Cinzel', serif; letter-spacing: 1px; padding: 2px 7px; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid; }
  .close-btn { position: absolute; top: 11px; right: 11px; background: none; border: 1px solid rgba(184,134,11,0.3); color: #c9a96e; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .close-btn:hover { background: rgba(184,134,11,0.2); color: #b8860b; }

  .card-body { padding: 12px 16px 16px; }
  .sec-title { font-family: 'Cinzel', serif; font-size: 9.5px; letter-spacing: 2px; color: #b8860b; text-transform: uppercase; margin-bottom: 7px; margin-top: 13px; opacity: 0.8; }
  .sec-title:first-child { margin-top: 0; }
  .card-desc { color: #c9a96e; font-size: 14px; line-height: 1.65; }
  .npc-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(184,134,11,0.18); border-radius: 3px; padding: 9px 11px; margin-bottom: 7px; }
  .npc-name { font-family: 'Cinzel', serif; color: #f0d090; font-size: 12px; font-weight: 600; margin-bottom: 3px; }
  .npc-desc { color: #b09060; font-size: 13px; line-height: 1.5; font-style: italic; }
  .notes-box { background: rgba(139,26,26,0.13); border: 1px solid rgba(139,26,26,0.28); border-radius: 3px; padding: 9px 11px; }
  .notes-text { color: #d4956a; font-size: 13px; line-height: 1.6; }
  .ornament { text-align: center; color: rgba(184,134,11,0.35); font-size: 13px; margin: 10px 0; letter-spacing: 4px; }


  /* MOBILE VERSION */
  @media (max-width: 860px) {
    html { min-height: 100%; background: #1a0f0a; }
    body {
      min-height: 100dvh;
      display: block;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 70;
      padding: calc(10px + env(safe-area-inset-top)) 48px 9px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    }
    header::before, header::after { font-size: 15px; }
    header h1 {
      font-size: clamp(17px, 5vw, 22px);
      letter-spacing: 1.5px;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    header p {
      font-size: 9px;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-layout {
      display: block;
      padding: 8px 0 0;
      min-height: auto;
    }

    .legend-panel {
      width: auto;
      position: sticky;
      top: calc(54px + env(safe-area-inset-top));
      z-index: 65;
      margin: 0 8px 8px;
      padding: 9px 10px 10px;
      border-radius: 6px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }
    .legend-title { display: none; }
    #districtLegend {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding-bottom: 2px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #districtLegend::-webkit-scrollbar { display: none; }
    .legend-item {
      flex: 0 0 auto;
      min-height: 34px;
      margin: 0;
      padding: 7px 9px;
      border: 1px solid rgba(184,134,11,0.18);
      background: rgba(0,0,0,0.18);
    }
    .legend-dot { width: 12px; height: 12px; }
    .legend-label { font-size: 12px; white-space: nowrap; }
    .search-section {
      margin-top: 8px;
      padding-top: 8px;
      position: relative;
    }
    .search-box {
      min-height: 40px;
      font-size: 16px;
      padding: 8px 11px;
    }
    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 90;
      max-height: 42dvh;
      overflow-y: auto;
      background: rgba(18,9,5,0.96);
      border-radius: 6px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
    }
    .search-result-item { min-height: 42px; padding: 8px 10px; }
    .sri-name { font-size: 12px; }
    .sri-dist { font-size: 12px; }

    .map-container {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      padding: 0 8px 150px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    body.sheet-open .map-container { padding-bottom: 64dvh; }
    .map-wrapper {
      width: min(190vw, 750px);
      max-width: none;
    }
    .map-wrapper img {
      width: 100%;
      max-width: none;
      border-width: 1px;
      box-shadow: 0 0 18px rgba(0,0,0,0.75);
    }

    .marker { touch-action: manipulation; }
    .marker::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    .marker:hover,
    .marker.active { transform: translate(-50%, -50%) scale(1.08); }
    .mc {
      width: 28px;
      height: 28px;
      border-width: 2px;
    }
    .mn { font-size: 11px; }
    .tip { display: none; }

    .info-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      width: auto;
      z-index: 100;
      max-height: 62dvh;
      overflow: visible;
      pointer-events: none;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .ph { display: none !important; }
    .loc-card {
      max-height: 62dvh;
      overflow-y: auto;
      border-radius: 14px 14px 0 0;
      border-width: 1px 0 0;
      box-shadow: 0 -18px 32px rgba(0,0,0,0.62);
      pointer-events: auto;
    }
    .loc-card.vis { animation: mobileSheet 0.18s ease-out; }
    @keyframes mobileSheet {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-hdr { padding: 15px 54px 12px 16px; }
    .card-num { font-size: 10px; letter-spacing: 1.4px; }
    .card-title { font-size: 19px; padding-right: 0; }
    .card-dist { font-size: 11px; border-radius: 12px; padding: 3px 8px; }
    .close-btn {
      top: 12px;
      right: 14px;
      width: 36px;
      height: 36px;
      font-size: 16px;
    }
    .card-body { padding: 14px 16px 20px; }
    .sec-title { font-size: 10px; letter-spacing: 1.4px; }
    .card-desc { font-size: 16px; line-height: 1.55; }
    .npc-item { padding: 10px 11px; }
    .npc-name { font-size: 13px; }
    .npc-desc, .notes-text { font-size: 15px; line-height: 1.5; }
  }

  @media (max-width: 420px) {
    header { padding-left: 36px; padding-right: 36px; }
    .map-wrapper { width: min(205vw, 750px); }
    .legend-panel { margin-left: 6px; margin-right: 6px; }
    .map-container { padding-left: 6px; padding-right: 6px; }
  }

</style>
</head>

<script>
const LOCS = [{"id":1,"name":"Дворцы нищих","district":"Старый Город","x":20.6,"y":23.9,"color":"#8B4513","description":"Два самых больших зиккурата в Старом Городе. Магазины и многоэтажные дома, построенные из бамбука, ютятся на террасах в большом количестве. Верхние уровни чище и менее заселены, чем те, что находятся на уровне улицы. Узкие деревянные мосты соединяют верхние уровни.","npcs":[],"notes":"Здесь заседают «нищие принцы» — пародия на торговых принцев без официальных полномочий, но с сетью должников и компромата."},{"id":2,"name":"Забег Палача","district":"Старый Город","x":16.8,"y":20.2,"color":"#8B4513","description":"Прямоугольная каменная яма 15 футов глубиной, 50 футов шириной и 200 футов длиной. Велоцирапторы, пантеры и другие голодные звери готовы ворваться в яму, когда преступники приговариваются к Забегу Палача. Каждый преступник, добравшийся живым до другого конца ямы, выигрывает свободу. Зрители делают ставки.","npcs":[{"name":"К'лаху","desc":"Нейтральная женщина-чультка, головорез. Собирает ставки. Предлагает персонажам помочь взыскать долг 500 зм с гладиатора Табана за 10%."},{"name":"Табан","desc":"Нейтральный мужчина-чульт, гладиатор-должник. Сопротивляется до тех пор, пока не опустится ниже 20 хитов — затем предлагает 50 зм и присоединяется к группе."}],"notes":"⚔️ Побочное задание №1 (взыскание долга). Побочное задание №9 (спасение невиновного Дразы)."},{"id":3,"name":"Яма с отходами","district":"Старый Город","x":23.2,"y":11.1,"color":"#8B4513","description":"Огромная выгребная яма — городской мусорный отвал. Сюда сбрасывается всё, включая мёртвые тела. Крысы, насекомые и вороны всегда обитают здесь. Иногда можно увидеть упырей, ищущих свежие трупы. На дне живут несколько отиджей, пожирающих мусор — они довольны, но быстро разозлятся, если кто-то упадёт вниз.","npcs":[],"notes":"⚠️ Отиджи на дне вступят в бой при вторжении."},{"id":4,"name":"Золотой Трон","district":"Купеческие ряды","x":33.5,"y":30.7,"color":"#DAA520","description":"Дворец — место встреч торговых принцев и правительство города. Самое богатое строение города. Почётный караул из восьми гладиаторов всегда на посту. Здесь можно встретить любого торгового принца без назначенной встречи (вероятность 1 к 6 в течение дня). Аудиенция — через 1к3 часов: торговые принцы показывают власть, а не занятость.","npcs":[],"notes":"🏛️ Главная точка контакта со всеми торговыми принцами. Расположен на Тронном Холме."},{"id":5,"name":"Поместья торговых принцев","district":"Купеческие ряды","x":41.5,"y":32.5,"color":"#DAA520","description":"У каждого торгового принца своё поместье с красивыми фресками, внутренними двориками и садами. Стены 8–12 футов высотой с зубами хищников и осколками стекла наверху. Круглосуточная охрана. Во входной галерее 1к4+1 гладиаторов. В охранной комнате — ещё столько же, фанатично преданных принцу.","npcs":[{"name":"Ваканга","desc":"Хаотично нейтральный мужчина чульт, дворянин. Рад гостям Синдры. Единственный принц, куда легко попасть с рекомендацией."},{"name":"Квайот","desc":"Законно нейтральная женщина чультка. Строгая, не терпит нарушений договорённостей. Любит чистоту и порядок."},{"name":"Джонси","desc":"Нейтрально добрая женщина чультка, дворянка. Тайный член Общества Йетепка. Монопольный торговец драгоценными камнями."},{"name":"Ифан Талро'а","desc":"Нейтрально злой мужчина чульт, дворянин. Жадный и безответственный торговец животными и их дрессировкой."},{"name":"Экини-Афа","desc":"Законно добрая женщина чультка, дворянка. Бывший гладиатор. Торгует оружием и снаряжением для путешествий."}],"notes":"🏠 К принцам не заходят без веского повода: победа в гонке, остановка нашествия, важная экспедиция.","points":[{"x":41.5,"y":32.5},{"x":24.3,"y":41.4}]},{"id":6,"name":"Большой базар","district":"Купеческие ряды","x":36.1,"y":39.6,"color":"#DAA520","description":"Огромный рынок — одно из трёх сердец города. Торговцы со всего Побережья Мечей: лесоматериалы, специи, медикаменты, черепа и когти динозавров, тигровые шкуры, резная кость, изделия батири и грунгов, тропические фрукты, мясо плезиозавра. Торги с рассвета до ночи. Много карманников и мошенников. Уличные актёры, табакси-менестрели. Всё снаряжение из 5-й главы Книги Игрока доступно здесь.","npcs":[],"notes":"🛒 Слонов в Чульте нет. Редкие предметы — через посредников, небесплатно."},{"id":7,"name":"Храм Савраса","district":"Купеческие ряды","x":61.9,"y":22,"color":"#6B8E23","description":"Древнее и величественное здание. Плиточная крыша огромного купола напоминает немигающее oko, глядящее в небо. Саврас — покровитель волшебников, прорицателей и тех, кто всегда говорит правду. Духовенство проводит предсказания: успех сделки, будущее новорождённого, любовные дела.","npcs":[{"name":"Дедуля Зетембей","desc":"Законно добрый мужчина чульт, священник. Управляющий храмом. При первой встрече — разговаривает с жентаримскими убийцами, ищущими Артуса Симбера. Если пожертвовать 25+ зм — проводит 24-часовой ритуал и видит: «город в джунглях на юге, окружённый скалами и кишащий змеями» и «чёрный обелиск, опутанный лозами»."}],"notes":"🔮 Ключевой NPC для информации о Поглотителе Душ. Побочное задание №4."},{"id":8,"name":"Храм Гонда","district":"Портовый квартал","x":70.6,"y":30.6,"color":"#4682B4","description":"Квадратный храм. Популярен среди артистов, ремесленников, кузнецов и гидроинженеров. В центре вместо традиционной кузницы расположен огромный фонтан, чьи воды постоянно меняются и образуют невероятные фигуры благодаря соплам и клапанам, управляющим мощным напором воды.","npcs":[],"notes":"⚙️ Уникальный фонтан вместо традиционной кузницы Гонда."},{"id":9,"name":"Храм Сьюни","district":"Портовый квартал","x":87.9,"y":16.8,"color":"#4682B4","description":"Расположен на небольшом острове — попасть можно только по дамбе или на лодке. Снаружи крыша кажется оторванной от основания — иллюзия, созданная зеркалами. Внутри: публичные ванны, уроки макияжа, причёсок и одежды. Проверка Харизмы при входе: 15+ — принимают как братьев и сестёр; 10–14 — дружески советуют улучшить внешний вид; 9 и ниже — окружают толпой сочувствующих приверженцев.","npcs":[],"notes":"🏝️ Управляет Общественными банями (зона 22). Вход бесплатный, но просят подношение."},{"id":10,"name":"Ювелирный рынок","district":"Купеческие ряды","x":44.1,"y":25.8,"color":"#DAA520","description":"Маленькая, но особенная версия Большого базара. Богатые запасы драгоценных камней из шахт Чульта и редкие предметы роскоши. Особо охраняется: открытые стражники и тайные шпионы. Все работают на торгового принца Джонси, владеющей монополией на продажу драгоценных камней.","npcs":[],"notes":"💎 Монополия Джонси. Лучшее место для покупки и продажи драгоценностей."},{"id":11,"name":"Королевские доки","district":"Портовый квартал","x":74.2,"y":35.3,"color":"#4682B4","description":"Название пришло из времён королей. Сейчас зарезервированы для торговых принцев, дипломатов и влиятельных иностранных торговцев. Здесь стоит «Дерзкий Пегас» — 60-футовый шлюп капитана Ортемей.","npcs":[{"name":"Ортемей Быстрая и Тёмная","desc":"Хаотично добрая женщина скальный гном, капитан разбойников. Тёмное зрение 60 фт. Умная и спокойная. Занимается контрабандой, но рада взять искателей приключений. Знает о драконьей черепахе Аремаг. Проезд: 10 зм/день."},{"name":"Григ Радделл","desc":"Нейтральный мужчина-иллусканец, ветеран. Первый помощник. Мускулистый, с густой бородой. Практически не разговаривает."}],"notes":"⛵ «Дерзкий Пегас»: 10 морских миль/час, экипаж 6 разбойников."},{"id":12,"name":"Статуя На Н'бусо","district":"Портовый квартал","x":68,"y":46,"color":"#4682B4","description":"Статуя в центре гавани изображает древнего короля Чульта: набедренная повязка из шкуры леопарда, головной убор из перьев и зубов тираннозавра, плащ из гираллонского меха, традиционный щит и иклва. Местные называют его На Н'бусо, Великий Король. Воздвигнута всего пять лет назад — чтобы убедить иностранцев в независимости Чульта.","npcs":[],"notes":"🗿 Современная постройка с мифическим королём. Немногие гости остаются равнодушными."},{"id":13,"name":"Офис смотрителя доков","district":"Портовый квартал","x":85.3,"y":32.4,"color":"#4682B4","description":"Крепкое и просторное здание. Снаружи — доска объявлений с названиями и расположением проводников по дикой местности. Зиндар редко бывает здесь — решает сотни споров на берегу. Можно оставить сообщение: ответ через 1к6 часов.","npcs":[{"name":"Зиндар","desc":"Золотой полудракон, смотритель доков. Тайный член Общества Йетепка. Знает о трёх пиратских капитанах. Выдаёт награду: 2000 зм за захваченный пиратский корабль + 500 зм за каждого капитана."}],"notes":"⚓ Начальная точка прибытия Синдры. Побочное задание №8 — охота на пиратов."},{"id":14,"name":"Маяк","district":"Портовый квартал","x":81.7,"y":45.2,"color":"#4682B4","description":"Огонь горит круглосуточно, ведя корабли к гавани сквозь тьму, туман и дождь. В огонь можно добавлять порошки для создания плотных столбов цветного дыма, видимого из Форта Белуриан и шахт вдоль бухты Чульта.","npcs":[],"notes":"🔦 Используется для сигнализации с фортом на расстоянии многих миль."},{"id":15,"name":"Форт Нянзару","district":"Портовый квартал","x":74.7,"y":51.2,"color":"#4682B4","description":"В форте расположена лебёдка для подъёма огромной железной цепи между фортом и маяком. Когда цепь поднята — ни один корабль не войдёт и не выйдет. Снаряжён двумя баллистами (тяжёлые болты или алхимический огонь). Гарнизон: дворянин-смотритель, четыре ветерана-офицера и сорок стражников.","npcs":[],"notes":"⚔️ Контролирует вход и выход из гавани. Цепь не применялась в бою десятилетия."},{"id":16,"name":"Склады","district":"Портовый квартал","x":48.9,"y":42.5,"color":"#4682B4","description":"На складах хранятся все ввозимые и вывозимые товары. Между рядами складов проделаны каналы, по которым корабли буксируются динозаврами прямо в нужный склад. Безлюдно ночью — удобное место для тайных встреч и интриг.","npcs":[],"notes":"🌙 Отличное место для ночных встреч. Регулированием занимается смотритель доков."},{"id":17,"name":"Сухой Dok","district":"Портовый квартал","x":59,"y":36.5,"color":"#4682B4","description":"Порт Нянзару не славится постройкой кораблей, но многие суда требуют ремонта — пострадавшие от тайфунов, пиратов или драконьей черепахи Аремаг. Динозавры легко вытягивают корабли из воды в сухой dok, где заделывают дыры в бортах и очищают от морских желудей.","npcs":[],"notes":"🦕 Аремаг — драконья черепаха в бухте. Многие суда повреждены именно ею."},{"id":18,"name":"Красный Базар","district":"Рыночный квартал","x":48.9,"y":64.3,"color":"#B22222","description":"Одно из трёх сердец города. Рынок повседневного спроса: местные фрукты, овощи, мясо, теж, лёгкая тропическая одежда, средства от насекомых. Продавцы и покупатели — преимущественно местные. Рядом две таверны: Громовая Ящерица (5 см/ночь, шумная) и Дом Отдыха Каи (1 зм/ночь, тихая). В обе наведываются проводники.","npcs":[],"notes":"🍖 Таверны: Громовая Ящерица (5 см) — шумная и грубая. Дом Отдыха Каи (1 зм) — тихая и дорогая."},{"id":19,"name":"Рыбный Рынок","district":"Рыночный квартал","x":60.6,"y":56.8,"color":"#B22222","description":"Морская еда — основной продукт Порта Нянзару: ловить рыбу безопаснее, чем охотиться на динозавров. Отличное место для покупки провианта. Утром цены выше, но качество лучше и выбор разнообразнее.","npcs":[],"notes":"🐟 Лучшее место для закупки провизии перед экспедицией."},{"id":20,"name":"Великий Колизей","district":"Рыночный квартал","x":50.3,"y":57.2,"color":"#B22222","description":"Каменная арена для гладиаторских боёв (как правило, не смертельных), боёв животных и цирка. Лучшие гладиаторы — знаменитости. Статуи чемпионов украшают вершину стены. Представления почти каждый полдень. Шоу включает: герои против пиратов, велоцирапторы с тиграми, волшебники против упырей и зомби.","npcs":[],"notes":"🏟️ Экини-Афа — бывший чемпион колизея. Широкий мост соединяет с горой Сибаса."},{"id":21,"name":"Золотой Чертог","district":"Рыночный квартал","x":69.1,"y":64.8,"color":"#B22222","description":"Величественный храм Вокин на горе Сибаса — высшей точке города. Местные зовут его Золотой Чертог за сияющий потолок. Когда светит солнце, свет виден в море за многие мили. Один из богатейших банков города.","npcs":[{"name":"Сибонсени, Мать Процветания","desc":"Законно нейтральная женщина чультка, священник Вокин. Один из самых влиятельных людей города. Путешествует в роскошном паланкине с барабанщиками, певцами и танцорами, раздающими медные монеты бедным."}],"notes":"✨ Сияющий потолок — на самом деле краска, а не золото. Народ очень любит Сибонсени."},{"id":22,"name":"Общественные Бани","district":"Рыночный квартал","x":80.9,"y":60.7,"color":"#B22222","description":"Жители щепетильно относятся к гигиене — многие не приемлют дня без ванны. Публичная баня открыта для всех. Богатые торговцы моются бок о бок с портовыми рабочими в мраморных раздевалках. Вход бесплатный, но просят подношение в раковину гигантского моллюска на входе. Независимые массажисты — 2к10 см.","npcs":[],"notes":"🛁 Управляется храмом Сьюни (зона 9). Даже бедняки оставляют хотя бы медную монету."},{"id":23,"name":"Красильня","district":"Рыночный квартал","x":79.2,"y":71.5,"color":"#B22222","description":"Чульты любят ярко одеваться. Джунгли и море дают всё для красителей всех цветов. Торговцы скупают лёгкие ткани, покрывают яркими красками и продают. Скалы и море вокруг красильни постоянно окрашены в яркие оранжевые, красные, зелёные и жёлтые цвета.","npcs":[{"name":"Омала","desc":"Нейтральный мужчина чульт, обыватель. Мастер-красильщик. Купил на чёрном рынке фрукты танцующей обезьяны. Получил железный знак от Общества Йетепка — угроза. Хочет попросить прощения у Квайот."}],"notes":"⚠️ Побочное задание №6 — помощь красильщику Омале. Работники узнаваемы по ярко окрашенным рукам."},{"id":24,"name":"Храм Тиморы","district":"Глотка Малара","x":23.7,"y":52.9,"color":"#556B2F","description":"Храм выстроен в виде мощного каменного блокпоста. Не отличается красотой, но является надёжным укрытием в Глотке Малара: когда сточные воды сливаются из Глотки или нежить наводняет ущелье — здесь можно спастись. Живущие в Глотке не считают себя удачливыми, но той толике везения, что у них есть, они благодарны Тиморе.","npcs":[],"notes":"🎲 «Леди» — так местные зовут Тимору. Единственное укреплённое здание трущоб."},{"id":25,"name":"Загоны для Динозавров","district":"Якорная стоянка Тайрикай","x":20.3,"y":75.4,"color":"#8B008B","description":"Большинство рабочих животных города выдрессированы здесь и остаются на ночь. Анкилозавры и трицератопсы наиболее распространены. Здесь же содержатся динозавры для уличных гонок. Дрессировщики имеют бонус +5 к Уходу за Животными.","npcs":[],"notes":"🦕 Животные чуют угрозы лучше людей — трудно проникнуть незамеченным. Нерегулируемые доки — рай для контрабандистов."}];

const DC = {
  "Старый Город": "#8B4513",
  "Купеческие ряды": "#DAA520",
  "Портовый квартал": "#4682B4",
  "Рыночный квартал": "#B22222",
  "Глотка Малара": "#556B2F",
  "Якорная стоянка Тайрикай": "#8B008B"
};

let activeId = null, filterDistrict = null;

// Legend
const leg = document.getElementById('districtLegend');
Object.entries(DC).forEach(([name, color]) => {
  const el = document.createElement('div');
  el.className = 'legend-item';
  el.innerHTML = `<div class="legend-dot" style="background:${color}"></div><span class="legend-label">${name}</span>`;
  el.addEventListener('click', () => {
    filterDistrict = filterDistrict === name ? null : name;
    document.querySelectorAll('.legend-item').forEach(li => li.style.opacity = '1');
    if (filterDistrict) document.querySelectorAll('.legend-item').forEach(li => {
      if (li.querySelector('.legend-label').textContent !== filterDistrict) li.style.opacity = '0.4';
    });
    updateDim();
  });
  leg.appendChild(el);
});

function updateDim() {
  document.querySelectorAll('.marker').forEach(m => {
    m.classList.toggle('dimmed', !!(filterDistrict && m.dataset.district !== filterDistrict));
  });
}

// Place markers
const mapImg = document.getElementById('mapImg');
const mapW   = document.getElementById('mapWrapper');

function placeMarkers() {
  document.querySelectorAll('.marker').forEach(function(m) { m.remove(); });
  LOCS.forEach(function(loc) {
    var points = loc.points || [{ x: loc.x, y: loc.y }];
    points.forEach(function(point) {
      var m = document.createElement('div');
      m.className = 'marker';
      m.setAttribute('data-id', loc.id);
      m.setAttribute('data-district', loc.district);
      m.style.left = point.x + '%';
      m.style.top  = point.y + '%';
      m.innerHTML = '<div class="tip">' + loc.id + '. ' + loc.name + '</div>' +
        '<div class="mc" style="background:' + loc.color + '">' +
        '<span class="mn">' + loc.id + '</span></div>';
      m.addEventListener('click', function() { showLoc(loc.id); });
      mapW.appendChild(m);
    });
  });
  updateDim();
}

function schedulePlaceMarkers() {
  window.requestAnimationFrame(function() {
    window.requestAnimationFrame(placeMarkers);
  });
}

if (mapImg.complete && mapImg.naturalWidth) schedulePlaceMarkers();
else mapImg.addEventListener('load', schedulePlaceMarkers);
window.addEventListener('resize', schedulePlaceMarkers);
window.addEventListener('orientationchange', schedulePlaceMarkers);

function showLoc(id) {
  const loc = LOCS.find(l => l.id === id);
  if (!loc) return;
  activeId = id;
  document.querySelectorAll('.marker').forEach(m => m.classList.toggle('active', m.dataset.id == id));

  let npcsHtml = '';
  if (loc.npcs && loc.npcs.length) {
    npcsHtml = `<div class="sec-title">📜 Персонажи</div>` +
      loc.npcs.map(n => `<div class="npc-item"><div class="npc-name">⚔ ${n.name}</div><div class="npc-desc">${n.desc}</div></div>`).join('');
  }
  let notesHtml = loc.notes ? `<div class="ornament">· · ·</div><div class="sec-title">📌 Заметки Мастера</div><div class="notes-box"><div class="notes-text">${loc.notes}</div></div>` : '';

  document.getElementById('locCard').innerHTML = `
    <div class="card-hdr" style="border-top:3px solid ${loc.color}">
      <button class="close-btn" onclick="closeLoc()">✕</button>
      <div class="card-num">ЛОКАЦИЯ №${loc.id}</div>
      <div class="card-title">${loc.name}</div>
      <span class="card-dist" style="color:${loc.color};border-color:${loc.color}">${loc.district}</span>
    </div>
    <div class="card-body">
      <div class="sec-title">📖 Описание</div>
      <div class="card-desc">${loc.description}</div>
      ${npcsHtml}${notesHtml}
    </div>`;

  document.getElementById('ph').style.display = 'none';
  const card = document.getElementById('locCard');
  card.classList.add('vis');
  card.scrollTop = 0;
  if (window.matchMedia('(max-width: 860px)').matches) document.body.classList.add('sheet-open');
}


function closeLoc() {
  document.getElementById('ph').style.display = 'block';
  document.getElementById('locCard').classList.remove('vis');
  document.querySelectorAll('.marker').forEach(m => m.classList.remove('active'));
  activeId = null;
  document.body.classList.remove('sheet-open');
}


// Search
const sb = document.getElementById('searchBox');
const sr = document.getElementById('searchResults');
sb.addEventListener('input', () => {
  const q = sb.value.toLowerCase().trim();
  sr.innerHTML = '';
  if (!q) return;
  const hits = LOCS.filter(l =>
    l.name.toLowerCase().includes(q) ||
    l.district.toLowerCase().includes(q) ||
    l.description.toLowerCase().includes(q) ||
    (l.npcs && l.npcs.some(function(n) { return n.name.toLowerCase().includes(q); }))
  );
  hits.forEach(l => {
    const d = document.createElement('div');
    d.className = 'search-result-item';
    d.innerHTML = `<div class="sri-name">${l.id}. ${l.name}</div><div class="sri-dist">${l.district}</div>`;
    d.addEventListener('click', () => { showLoc(l.id); sb.value=''; sr.innerHTML=''; });
    sr.appendChild(d);
  });
  if (!hits.length) sr.innerHTML = '<div style="color:#6b4c30;font-size:11px;padding:4px 0">Не найдено</div>';
});
document.addEventListener('click', e => {
  if (!sb.contains(e.target) && !sr.contains(e.target)) sr.innerHTML = '';
});
</script>
